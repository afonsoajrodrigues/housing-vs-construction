<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" width="720" height="456" role="img">
<style>
    .surface { fill: var(--surface-1); }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text-primary); }
    .subtitle, .axis-label, .footer { fill: var(--text-secondary); }
    .muted { fill: var(--text-muted); }
    .gridline { stroke: var(--gridline); stroke-width: 1; }
    .baseline { stroke: var(--baseline); stroke-width: 1; }
    :root { color-scheme: light; }
    svg {
      --surface-1: #fcfcfb;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #898781;
      --gridline: #e1e0d9;
      --baseline: #c3c2b7;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --context-bar: #c3c2b7;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --surface-1: #1a1a19;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted: #898781;
        --gridline: #2c2c2a;
        --baseline: #383835;
        --series-1: #3987e5;
        --series-2: #d95926;
        --context-bar: #383835;
      }
    }
</style>
<rect class="surface" x="0" y="0" width="720" height="456"/>

<text x="140" y="30" font-size="19" font-weight="600">Portugal leads Europe's house-price surge</text>
<text class="subtitle" x="140" y="52" font-size="13">Growth in the house price index, 2020-2025 (%)</text>
<line class="gridline" x1="140.0" y1="70" x2="140.0" y2="390"/>
<text class="axis-label" x="140.0" y="408" font-size="12" text-anchor="middle">+0%</text>
<line class="gridline" x1="267.5" y1="70" x2="267.5" y2="390"/>
<text class="axis-label" x="267.5" y="408" font-size="12" text-anchor="middle">+20%</text>
<line class="gridline" x1="395.0" y1="70" x2="395.0" y2="390"/>
<text class="axis-label" x="395.0" y="408" font-size="12" text-anchor="middle">+40%</text>
<line class="gridline" x1="522.5" y1="70" x2="522.5" y2="390"/>
<text class="axis-label" x="522.5" y="408" font-size="12" text-anchor="middle">+60%</text>
<line class="gridline" x1="650.0" y1="70" x2="650.0" y2="390"/>
<text class="axis-label" x="650.0" y="408" font-size="12" text-anchor="middle">+80%</text>
<line class="baseline" x1="140" y1="70" x2="140" y2="390"/>
<text x="128" y="94.0" font-size="13" text-anchor="end" font-weight="400">France</text>
<rect x="140" y="79.0" width="58.2" height="22" rx="4" fill="var(--context-bar)"><title>France: +9.1% between 2020 and 2025 (CAGR 1.8%/yr)</title></rect>
<text x="206.2" y="94.0" font-size="13" font-weight="400">+9%</text>
<text x="128" y="134.0" font-size="13" text-anchor="end" font-weight="400">Germany</text>
<rect x="140" y="119.0" width="64.3" height="22" rx="4" fill="var(--context-bar)"><title>Germany: +10.1% between 2020 and 2025 (CAGR 1.9%/yr)</title></rect>
<text x="212.3" y="134.0" font-size="13" font-weight="400">+10%</text>
<text x="128" y="174.0" font-size="13" text-anchor="end" font-weight="400">Italy</text>
<rect x="140" y="159.0" width="100.3" height="22" rx="4" fill="var(--context-bar)"><title>Italy: +15.7% between 2020 and 2025 (CAGR 3.0%/yr)</title></rect>
