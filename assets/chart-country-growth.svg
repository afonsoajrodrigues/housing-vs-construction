<rect x="140" y="199.0" width="144.5" height="22" rx="4" fill="var(--context-bar)"><title>Belgium: +22.7% between 2020 and 2025 (CAGR 4.2%/yr)</title></rect>
<text x="292.5" y="214.0" font-size="13" font-weight="400">+23%</text>
<text x="128" y="254.0" font-size="13" text-anchor="end" font-weight="400">Austria</text>
<rect x="140" y="239.0" width="149.6" height="22" rx="4" fill="var(--context-bar)"><title>Austria: +23.5% between 2020 and 2025 (CAGR 4.3%/yr)</title></rect>
<text x="297.6" y="254.0" font-size="13" font-weight="400">+23%</text>
<text x="128" y="294.0" font-size="13" text-anchor="end" font-weight="400">Spain</text>
<rect x="140" y="279.0" width="265.5" height="22" rx="4" fill="var(--context-bar)"><title>Spain: +41.6% between 2020 and 2025 (CAGR 7.2%/yr)</title></rect>
<text x="413.5" y="294.0" font-size="13" font-weight="400">+42%</text>
<text x="128" y="334.0" font-size="13" text-anchor="end" font-weight="400">Netherlands</text>
<rect x="140" y="319.0" width="314.5" height="22" rx="4" fill="var(--context-bar)"><title>Netherlands: +49.3% between 2020 and 2025 (CAGR 8.4%/yr)</title></rect>
<text x="462.5" y="334.0" font-size="13" font-weight="400">+49%</text>
<text x="128" y="374.0" font-size="13" text-anchor="end" font-weight="600">Portugal</text>
<rect x="140" y="359.0" width="452.4" height="22" rx="4" fill="var(--series-1)"><title>Portugal: +71.0% between 2020 and 2025 (CAGR 11.3%/yr)</title></rect>
<text x="600.4" y="374.0" font-size="13" font-weight="600">+71%</text>
<text class="footer" x="140" y="422" font-size="11">Source: Eurostat (prc_hpi_a) and INE — accessed 2026-07-23.</text>
<text class="footer" x="140" y="440" font-size="11">Index re-based to 2020=100 before calculating growth.</text>
</svg>