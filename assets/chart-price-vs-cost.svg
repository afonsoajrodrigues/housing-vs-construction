<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img">
<style>
    .surface { fill: var(--surface-1); }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text-primary); }
    .subtitle, .axis-label, .footer { fill: var(--text-secondary); }
    .muted { fill: var(--text-muted); }
    .gridline { stroke: var(--gridline); stroke-width: 1; }
    .baseline { stroke: var(--baseline); stroke-width: 1; }
    :root { color-scheme: light; }
    svg {
      --surface-1: #fcfcfb;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #898781;
      --gridline: #e1e0d9;
      --baseline: #c3c2b7;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --context-bar: #c3c2b7;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --surface-1: #1a1a19;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted: #898781;
        --gridline: #2c2c2a;
        --baseline: #383835;
        --series-1: #3987e5;
        --series-2: #d95926;
        --context-bar: #383835;
      }
    }
</style>
<rect class="surface" x="0" y="0" width="720" height="480"/>

